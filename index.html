<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    text-align: center;
    padding: 22px 10px;
    font-size: 28px;
    font-weight: bold;
}

.app {
    width: 94%;
    max-width: 900px;
    margin: auto;
}

.sky {
    height: 350px;
    border-radius: 25px;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding-top: 55px;
    background: linear-gradient(#38bdf8, #bae6fd);
    transition: background 0.5s;
}

.weather-icon {
    font-size: 80px;
}

.temperature {
    font-size: 60px;
    font-weight: bold;
}

.condition {
    font-size: 24px;
}

.clock {
    margin-top: 12px;
    font-size: 18px;
}

.controls,
.stats {
    margin-top: 20px;
    background: #1c2638;
    padding: 22px;
    border-radius: 22px;
}

.control {
    margin-bottom: 25px;
}

.control-title {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-bottom: 8px;
}

input[type="range"] {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    flex: 1;
    min-width: 100px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: #334155;
    color: white;
    font-size: 16px;
}

button:active {
    transform: scale(0.97);
}

.rain,
.snow {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.drop {
    position: absolute;
    width: 2px;
    height: 18px;
    background: white;
    opacity: 0.65;
    animation: rainFall 0.7s linear infinite;
}

@keyframes rainFall {
    from {
        transform: translateY(-30px);
    }

    to {
        transform: translateY(380px);
    }
}

.flake {
    position: absolute;
    font-size: 16px;
    animation: snowFall 4s linear infinite;
}

@keyframes snowFall {
    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(380px);
    }
}

.stats div {
    margin: 12px 0;
    font-size: 17px;
}
</style>
</head>

<body>

<header>🌦️ Weather Simulator</header>

<div class="app">

    <div class="sky" id="sky">

        <div class="weather-icon" id="weatherIcon">
            ☀️
        </div>

        <div class="temperature" id="temperature">
            20°C
        </div>

        <div class="condition" id="condition">
            Clear Sky
        </div>

        <div class="clock" id="clock">
            12:00
        </div>

        <div class="rain" id="rainContainer"></div>
        <div class="snow" id="snowContainer"></div>

    </div>

    <div class="controls">

        <div class="control">
            <div class="control-title">
                <span>🌡️ Temperature</span>
                <span id="tempValue">20°C</span>
            </div>

            <input
                id="temp"
                type="range"
                min="-30"
                max="45"
                value="20"
            >
        </div>

        <div class="control">
            <div class="control-title">
                <span>🌧️ Rain</span>
                <span id="rainValue">0%</span>
            </div>

            <input
                id="rain"
                type="range"
                min="0"
                max="100"
                value="0"
            >
        </div>

        <div class="control">
            <div class="control-title">
                <span>☁️ Clouds</span>
                <span id="cloudValue">20%</span>
            </div>

            <input
                id="clouds"
                type="range"
                min="0"
                max="100"
                value="20"
            >
        </div>

        <div class="control">
            <div class="control-title">
                <span>💨 Wind</span>
                <span id="windValue">10 km/h</span>
            </div>

            <input
                id="wind"
                type="range"
                min="0"
                max="150"
                value="10"
            >
        </div>

        <div class="buttons">
            <button onclick="setWeather('clear')">☀️ Clear</button>
            <button onclick="setWeather('rain')">🌧️ Rain</button>
            <button onclick="setWeather('snow')">❄️ Snow</button>
            <button onclick="setWeather('storm')">⛈️ Storm</button>
            <button onclick="setWeather('cloudy')">☁️ Cloudy</button>
        </div>

        <div class="buttons">
            <button onclick="startSimulation()">▶️ Start</button>
            <button onclick="stopSimulation()">⏸️ Pause</button>
            <button onclick="resetSimulation()">🔄 Reset</button>
        </div>

    </div>

    <div class="stats">

        <h2>📊 Weather Data</h2>

        <div>🌡️ Temperature:
            <span id="statTemp">20°C</span>
        </div>

        <div>🌧️ Rain:
            <span id="statRain">0%</span>
        </div>

        <div>☁️ Clouds:
            <span id="statCloud">20%</span>
        </div>

        <div>💨 Wind Speed:
            <span id="statWind">10 km/h</span>
        </div>

        <div>🌦️ Condition:
            <span id="statCondition">Clear Sky</span>
        </div>

    </div>

</div>

<script>

const temp = document.getElementById("temp");
const rain = document.getElementById("rain");
const clouds = document.getElementById("clouds");
const wind = document.getElementById("wind");

let simulationTime = 720;
let simulationRunning = false;
let timer = null;

function updateWeather() {

    const t = Number(temp.value);
    const r = Number(rain.value);
    const c = Number(clouds.value);
    const w = Number(wind.value);

    document.getElementById("tempValue").textContent = t + "°C";
    document.getElementById("rainValue").textContent = r + "%";
    document.getElementById("cloudValue").textContent = c + "%";
    document.getElementById("windValue").textContent = w + " km/h";

    document.getElementById("statTemp").textContent = t + "°C";
    document.getElementById("statRain").textContent = r + "%";
    document.getElementById("statCloud").textContent = c + "%";
    document.getElementById("statWind").textContent = w + " km/h";

    document.getElementById("temperature").textContent = t + "°C";

    let icon = "☀️";
    let condition = "Clear Sky";

    if (t <= 0 && r > 20) {
        icon = "❄️";
        condition = "Snow";
    }
    else if (r > 75 && w > 50) {
        icon = "⛈️";
        condition = "Thunderstorm";
    }
    else if (r > 50) {
        icon = "🌧️";
        condition = "Heavy Rain";
    }
    else if (r > 15) {
        icon = "🌦️";
        condition = "Rain";
    }
    else if (c > 75) {
        icon = "☁️";
        condition = "Overcast";
    }
    else if (c > 35) {
        icon = "🌤️";
        condition = "Partly Cloudy";
    }
    else if (t >= 32) {
        icon = "🔥";
        condition = "Very Hot";
    }

    document.getElementById("weatherIcon").textContent = icon;
    document.getElementById("condition").textContent = condition;
    document.getElementById("statCondition").textContent = condition;

    updateSky(c);
    createPrecipitation(r, t);
}

function updateSky(c) {

    const hour = Math.floor(simulationTime / 60);

    if (hour >= 20 || hour < 6) {
        document.getElementById("sky").style.background =
            "linear-gradient(#080b20, #172554)";
    }
    else if (c > 70) {
        document.getElementById("sky").style.background =
            "linear-gradient(#64748b, #94a3b8)";
    }
    else {
        document.getElementById("sky").style.background =
            "linear-gradient(#38bdf8, #bae6fd)";
    }
}

function createPrecipitation(r, t) {

    const rainContainer =
        document.getElementById("rainContainer");

    const snowContainer =
        document.getElementById("snowContainer");

    rainContainer.innerHTML = "";
    snowContainer.innerHTML = "";

    if (t <= 0 && r > 20) {

        for (let i = 0; i < 35; i++) {

            const flake = document.createElement("div");

            flake.className = "flake";
            flake.textContent = "❄️";

            flake.style.left =
                Math.random() * 100 + "%";

            flake.style.animationDelay =
                Math.random() * 4 + "s";

            snowContainer.appendChild(flake);
        }

    }
    else if (r > 10) {

        for (let i = 0; i < 60; i++) {

            const drop = document.createElement("div");

            drop.className = "drop";

            drop.style.left =
                Math.random() * 100 + "%";

            drop.style.animationDelay =
                Math.random() + "s";

            rainContainer.appendChild(drop);
        }
    }
}

function setWeather(type) {

    if (type === "clear") {
        temp.value = 22;
        rain.value = 0;
        clouds.value = 10;
        wind.value = 10;
    }

    if (type === "rain") {
        temp.value = 15;
        rain.value = 70;
        clouds.value = 90;
        wind.value = 25;
    }

    if (type === "snow") {
        temp.value = -4;
        rain.value = 60;
        clouds.value = 90;
        wind.value = 15;
    }

    if (type === "storm") {
        temp.value = 20;
        rain.value = 95;
        clouds.value = 100;
        wind.value = 90;
    }

    if (type === "cloudy") {
        temp.value = 17;
        rain.value = 5;
        clouds.value = 85;
        wind.value = 15;
    }

    updateWeather();
}

function updateClock() {

    let hours = Math.floor(simulationTime / 60);
    let minutes = simulationTime % 60;

    document.getElementById("clock").textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0");

    updateSky(Number(clouds.value));
}

function startSimulation() {

    if (simulationRunning) return;

    simulationRunning = true;

    timer = setInterval(() => {

        simulationTime += 10;

        if (simulationTime >= 1440) {
            simulationTime = 0;
        }

        updateClock();

    }, 1000);
}

function stopSimulation() {

    simulationRunning = false;
    clearInterval(timer);
}

function resetSimulation() {

    stopSimulation();

    simulationTime = 720;

    temp.value = 20;
    rain.value = 0;
    clouds.value = 20;
    wind.value = 10;

    updateWeather();
    updateClock();
}

temp.addEventListener("input", updateWeather);
rain.addEventListener("input", updateWeather);
clouds.addEventListener("input", updateWeather);
wind.addEventListener("input", updateWeather);

updateWeather();
updateClock();

</script>

</body>
  </html>
